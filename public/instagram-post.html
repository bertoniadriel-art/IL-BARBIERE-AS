<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Barbiere — Instagram Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .post {
            width: 1080px;
            height: 1080px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
        }

        /* Neon glow backgrounds */
        .glow-cyan {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .glow-purple {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(188, 0, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        /* WhatsApp messages */
        .whatsapp-container {
            position: absolute;
            top: 80px;
            right: 60px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: rotate(3deg);
        }

        .whatsapp-msg {
            background: #25D366;
            color: #000;
            padding: 14px 20px;
            border-radius: 20px 20px 6px 20px;
            font-size: 15px;
            font-weight: 600;
            max-width: 240px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-msg:nth-child(1) { opacity: 1; }
        .whatsapp-msg:nth-child(2) { opacity: 0.8; margin-left: 20px; }
        .whatsapp-msg:nth-child(3) { opacity: 0.6; margin-left: 10px; }

        /* Main content */
        .content {
            position: relative;
            z-index: 2;
        }

        .headline {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 110px;
            color: #fff;
            line-height: 0.85;
            letter-spacing: 6px;
            margin-bottom: 30px;
        }

        .headline .gradient {
            background: linear-gradient(to right, #00f3ff, #bc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subheadline {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            max-width: 450px;
            line-height: 1.5;
        }

        /* Solution card */
        .solution {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 24px;
            padding: 32px 40px;
            display: flex;
            align-items: center;
            gap: 24px;
            backdrop-filter: blur(10px);
        }

        .solution-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00f3ff, #bc00ff);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .solution-text h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .solution-text p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .brand-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 42px;
            color: #fff;
            letter-spacing: 6px;
            line-height: 1;
        }

        .brand-location {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .cta {
            background: linear-gradient(135deg, #00f3ff, #bc00ff);
            color: #000;
            padding: 18px 36px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
        }

        /* Barber photos */
        .barbers {
            position: absolute;
            bottom: 180px;
            right: 60px;
            display: flex;
            gap: -20px;
        }

        .barber-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #0a0a0a;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .barber-avatar:nth-child(2) {
            margin-left: -20px;
        }

        /* Powered by */
        .powered {
            position: absolute;
            bottom: 30px;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .powered-logo {
            height: 40px;
            width: auto;
        }

        .powered-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="post">
        <!-- Neon glows -->
        <div class="glow-cyan"></div>
        <div class="glow-purple"></div>

        <!-- WhatsApp messages -->
        <div class="whatsapp-container">
            <div class="whatsapp-msg">¿Tenés turno?</div>
            <div class="whatsapp-msg">¿A qué hora abren?</div>
            <div class="whatsapp-msg">¿Me podés confirmar?</div>
        </div>

        <!-- Main content -->
        <div class="content">
            <h1 class="headline">
                DEJALOS<br>
                <span class="gradient">DISFRUTAR</span><br>
                DEL MUNDIAL
            </h1>
            <p class="subheadline">Sin WhatsApp. Sin interrumpir. Sin estrés.</p>
        </div>

        <!-- Solution card -->
        <div class="solution">
            <div class="solution-icon">📱</div>
            <div class="solution-text">
                <h3>RESERVÁ EN 30 SEGUNDOS</h3>
                <p>Elegí barbero → Servicio → Hora → Listo</p>
            </div>
        </div>

        <!-- Barber photos -->
        <div class="barbers">
            <img src="assets/barbers/santi.png" alt="Santi Ducca" class="barber-avatar">
            <img src="assets/barbers/fede.png" alt="Fede Diaz" class="barber-avatar">
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="brand">
                <img src="assets/logo/logo-official.jpg" alt="Il Barbiere" class="brand-logo">
                <div class="brand-name">IL BARBIERE</div>
                <div class="brand-location">Arroyo Seco, Santa Fe</div>
            </div>
            <div class="cta">LINK EN BIO</div>
        </div>

        <!-- Powered by -->
        <div class="powered">
            <img src="assets/logo/adriel-ia-logo.png" alt="Soluciones Adriel-IA" class="powered-logo">
            <span class="powered-text">Hecho por Soluciones Adriel-IA</span>
        </div>
    </div>
</body>
</html>
