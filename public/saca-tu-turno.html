<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>IL BARBIERE — Saca tu Turno</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan:   #00f3ff;
      --purple: #bc00ff;
      --bg:     #0a0a0a;
      --border: rgba(255,255,255,.1);
      --text:   #ededed;
      --muted:  rgba(237,237,237,.4);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 65% 0%, rgba(0,243,255,.06) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      padding: 32px 28px 36px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,243,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,243,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(0,243,255,.35);
      object-fit: cover;
      flex-shrink: 0;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: .2em;
      color: var(--text);
    }

    /* ── Hero ── */
    .hero-pre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 13vw, 64px);
      letter-spacing: .04em;
      line-height: 1;
      color: var(--text);
    }

    .hero-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 22vw, 108px);
      letter-spacing: .02em;
      line-height: .9;
      background: linear-gradient(135deg, #00f3ff, #bc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      margin: 20px 0 26px;
    }

    .subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .subtitle-line {
      width: 32px;
      height: 2px;
      background: var(--cyan);
      margin-bottom: 32px;
    }

    /* ── Steps ── */
    .steps { display: flex; flex-direction: column; flex: 1; }

    .step { display: flex; align-items: flex-start; gap: 16px; }

    .step-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: .05em;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,243,255,.06);
      flex-shrink: 0;
    }

    .step-line {
      width: 1.5px;
      flex: 1;
      min-height: 24px;
      background: linear-gradient(to bottom, rgba(0,243,255,.35), rgba(0,243,255,.03));
      margin: 5px 0;
    }

    .step-content {
      padding-bottom: 26px;
      padding-top: 6px;
    }

    .step:last-child .step-content { padding-bottom: 0; }

    .step-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 3px;
    }

    .step-desc {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* ── CTA ── */
    .cta-wrap {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .cta-btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00f3ff, #bc00ff);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: .3em;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 0 32px rgba(0,243,255,.2), 0 0 60px rgba(188,0,255,.12);
      transition: opacity .15s;
    }

    .cta-btn:active { opacity: .85; }

    .footer {
      font-size: 11px;
      color: rgba(255,255,255,.3);
      text-align: center;
      letter-spacing: .05em;
    }

    .footer span { color: rgba(255,255,255,.5); }
  </style>
</head>
